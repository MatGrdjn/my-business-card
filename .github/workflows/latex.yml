name: Build LaTeX document

on: 
  push:
    tags:
      - '*'

permissions: 
  contents: write

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v6

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: card.tex
          compiler: xelatex

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: card.pdf